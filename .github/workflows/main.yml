name: Pinterest Bot Runner

on:
  schedule:
    - cron: '*/20 * * * *' # Har 20 minute mein chalega
  workflow_dispatch: # Manual run ke liye button dega

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python bot.py
